{% extends "inventario/base.html" %}

{% block title %}{{ titulo }} | RataStock ES2{% endblock %}

{% block content %}
<section class="tarjeta">
    <h1>{{ titulo }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="acciones">
            <button type="submit">Guardar</button>
            <a class="boton secundario" href="{% url 'inventario:lista_productos' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
